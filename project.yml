name: SilentBell
options:
  bundleIdPrefix: app.silentbell
  createIntermediateGroups: true
targets:
  SilentBell:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SilentBell
        excludes:
          - Info.plist
    info:
      path: SilentBell/Info.plist
      properties:
        CFBundleDisplayName: Silent Bell
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes:
          - physical-therapy
        # The app contains no encryption of any kind. Declaring it here answers
        # App Store Connect's export-compliance question at upload time instead
        # of once per build by hand.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.silentbell.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        # watchOS app targets default to SKIP_INSTALL=YES, which is right when the
        # watch app is embedded inside an iOS companion. This app is standalone, so
        # skipping install produced an .xcarchive with an empty Products directory
        # and xcodebuild offered no distribution methods at all.
        SKIP_INSTALL: NO
