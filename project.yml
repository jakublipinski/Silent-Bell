name: SilentBell
options:
  bundleIdPrefix: app.silentbell
  createIntermediateGroups: true
targets:
  SilentBell:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: SilentBell
        excludes:
          - Info.plist
    info:
      path: SilentBell/Info.plist
      properties:
        CFBundleDisplayName: Silent Bell
        WKApplication: true
        WKWatchOnly: true
        WKBackgroundModes:
          - physical-therapy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.silentbell.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
