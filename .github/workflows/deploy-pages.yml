# Deploy the static site in website/ to GitHub Pages.
#
# Deploying from a workflow rather than a branch keeps the published site decoupled
# from the repository layout: the app source lives at the root, only website/ is
# ever published, and there is no gh-pages branch to keep in sync.
name: Deploy website to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a run that is already publishing.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "website"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
